<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Shop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Navigation -->
    <header class="navbar">
        <div class="logo">IT Shop</div>
        <div class="nav-links">
            <span class="home-text">Home</span>
            <div class="cart-icon">
                🛒 <span class="badge">0</span>
            </div>
        </div>
    </header>

    <!-- Main Product Grid -->
    <main class="container">
        <div class="product-grid">
            
            <!-- Laptop 1 -->
            <div class="card">
                <img src="images/laptop.webp" alt="Laptop 1">
                <h3>Laptop 1</h3>
                <p class="price">Price : 2300000 MMK</p>
                <button class="btn">Add to Cart</button>
            </div>

            <!-- Laptop 2 -->
            <div class="card">
                <img src="images/laptop1.webp" alt="Laptop 2">
                <h3>Laptop 2</h3>
                <p class="price">Price : 2000000</p>
                <button class="btn">Add to Cart</button>
            </div>

            <!-- Laptop 3 -->
            <div class="card">
                <img src="images/laptop2.webp" alt="Laptop 3">
                <h3>Laptop 3</h3>
                <p class="price">Price : 1900000</p>
                <button class="btn">Add to Cart</button>
            </div>

            <!-- Laptop 4 -->
            <div class="card">
                <img src="images/laptop3.webp" alt="Laptop 4">
                <h3>Laptop 4</h3>
                <p class="price">Price : 1850000</p>
                <button class="btn">Add to Cart</button>
            </div>

            <!-- iPhone 1 -->
            <div class="card">
                <img src="images/ip14pro.webp" alt="iPhone 1">
                <h3>iPhone 1</h3>
                <p class="price">Price : 3400000</p>
                <button class="btn">Add to Cart</button>
            </div>

            <!-- iPhone 2 -->
            <div class="card">
                <img src="images/ip14pro1.webp" alt="iPhone 2">
                <h3>iPhone 2</h3>
                <p class="price">Price : 3200000</p>
                <button class="btn">Add to Cart</button>
            </div>

            <!-- iPhone 3 -->
            <div class="card">
                <img src="images/ip14pro2.webp" alt="iPhone 3">
                <h3>iPhone 3</h3>
                <p class="price">Price : 3100000</p>
                <button class="btn">Add to Cart</button>
            </div>

            <!-- iPhone 4 -->
            <div class="card">
                <img src="images/ip14pro4.webp" alt="iPhone 4">
                <h3>iPhone 4</h3>
                <p class="price">Price : 3000000</p>
                <button class="btn">Add to Cart</button>
            </div>

        </div>
    </main>

</body>
</html>
